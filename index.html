<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Younes Dental Clinic — Coming Soon</title>
  <meta name="description" content="Younes Dental Clinic. Our new website is on the way.">
  <meta name="robots" content="noindex">

  <meta property="og:title" content="Younes Dental Clinic — Coming Soon">
  <meta property="og:description" content="Our new website is on the way.">
  <meta property="og:type" content="website">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e7c86'/><text x='50' y='68' font-size='46' font-family='Georgia,serif' font-weight='bold' fill='white' text-anchor='middle'>Y</text></svg>">

  <style>
    :root {
      --bg: #f7fbfb;
      --bg-accent: #e8f3f4;
      --surface: #ffffff;
      --ink: #0f2c30;
      --ink-soft: #4a6b70;
      --brand: #0e7c86;
      --brand-soft: #7fc4cb;
      --line: rgba(14, 124, 134, 0.14);
      --shadow: 0 24px 60px -28px rgba(15, 44, 48, 0.28);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #071618;
        --bg-accent: #0c2226;
        --surface: #0d1f22;
        --ink: #eaf6f7;
        --ink-soft: #9dbabe;
        --brand: #4fb3bd;
        --brand-soft: #2b6b73;
        --line: rgba(126, 196, 203, 0.16);
        --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.7);
      }
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      background: var(--bg);
      background-image:
        radial-gradient(60rem 40rem at 50% -10%, var(--bg-accent), transparent 70%),
        radial-gradient(40rem 30rem at 100% 100%, var(--bg-accent), transparent 65%);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      min-height: 100%;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 40rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 1.5rem;
      box-shadow: var(--shadow);
      padding: clamp(2rem, 6vw, 3.5rem) clamp(1.5rem, 6vw, 3.5rem);
      animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    .mark {
      width: 5.25rem;
      height: 5.25rem;
      margin: 0 auto 1.5rem;
      display: block;
      color: var(--brand);
    }

    .acronym {
      font-size: 0.8rem;
      letter-spacing: 0.42em;
      text-indent: 0.42em;
      text-transform: uppercase;
      color: var(--brand);
      font-weight: 700;
      margin: 0 0 0.65rem;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(1.9rem, 6vw, 2.75rem);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .rule {
      width: 3.5rem;
      height: 2px;
      margin: 1.75rem auto;
      border: 0;
      background: linear-gradient(to right, transparent, var(--brand-soft), transparent);
    }

    .lede {
      margin: 0 auto;
      max-width: 26rem;
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--ink-soft);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
      background: color-mix(in srgb, var(--brand) 7%, transparent);
    }

    .dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--brand);
      animation: pulse 2.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }

    footer {
      margin-top: 2.25rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Tooth mark -->
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M32 10c-5.2 0-7.4-2.4-13-2.4C12.6 7.6 8 12.6 8 20.6c0 6 2.1 9.6 3.4 14.2 1.1 3.8 1.6 7.3 2.2 11.6.5 3.7 1.3 7.6 4.3 7.6 3.2 0 4.1-3.6 4.9-7.6.9-4.6 1.8-9.4 3.6-11.6 1.3-1.6 3.1-2.2 5.6-2.2s4.3.6 5.6 2.2c1.8 2.2 2.7 7 3.6 11.6.8 4 1.7 7.6 4.9 7.6 3 0 3.8-3.9 4.3-7.6.6-4.3 1.1-7.8 2.2-11.6C53.9 30.2 56 26.6 56 20.6c0-8-4.6-13-11-13-5.6 0-7.8 2.4-13 2.4Z"
            stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M20 20.5c1.6-3 4.6-4.6 8-4.6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity="0.45"/>
    </svg>

    <p class="acronym">YDC</p>
    <h1>Younes Dental Clinic</h1>

    <hr class="rule">

    <p class="lede">
      Our new website is on the way. We're putting the finishing touches
      on something worth the wait.
    </p>

    <span class="badge"><span class="dot"></span> Coming Soon</span>
  </main>

  <footer>&copy; <span id="year">2026</span> Younes Dental Clinic</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
